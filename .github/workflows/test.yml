name: Test

# Until this existed, `check-migration.yml` was the repo's only workflow: the
# delegate that holds users' signing keys, and the vault that recovers them
# across a re-key, both merged with no automated test, lint, or format gate.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Named to match rust-toolchain.toml, which is what actually governs the
      # build: it outranks the rustup default this action sets. Stated
      # explicitly here because the version matters — the delegate key is
      # BLAKE3(BLAKE3(wasm) || params), so a different rustc yields a different
      # key — but the toml is what enforces it, not this line.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # The UI embeds the delegate WASM via include_bytes!, so the artifact has
      # to exist before the UI crate can be built or linted at all.
      # Through the script: it also fails the build if any absolute
      # $CARGO_HOME path is embedded, which is what keeps the delegate key
      # machine-independent (ghostkeys#9).
      - name: Build delegate WASM
        run: bash scripts/build-delegate.sh

      # Lint against wasm32 rather than the host. The UI's real code paths are
      # behind `#[cfg(target_arch = "wasm32")]`, so a native lint sees stubs
      # and reports the whole delegate API as dead code while missing anything
      # actually wrong in the shipped code.
      - name: Clippy (shipped target)
        run: cargo clippy --target wasm32-unknown-unknown --workspace -- -D warnings

      # wasm32 does not compile #[cfg(test)] code at all, so without this pass
      # the test modules are linted by nothing. Native, and matching
      # `cargo make clippy-tests`.
      - name: Clippy (test code)
        run: cargo clippy --workspace --tests -- -D warnings

      # Run natively: this is what exercises the pure decision logic (probe
      # classification, migration outcomes, base64 and PEM parsing) plus the
      # delegate's own tests.
      - name: Test
        run: cargo test --workspace

  # scripts/record-migration.sh is the mechanism that puts a published
  # delegate's hash on main, and legacy_delegates.toml is the only thing that
  # carries users' ghost keys across a re-key. It is shell, so `cargo test`
  # cannot see it, and it runs by hand at publish time, so a mistake in it
  # surfaces at the worst possible moment. These tests drive it against
  # throwaway local repositories -- no network, no GitHub -- and cover the
  # failure paths (rejected push, unreachable remote, dirty tree, concurrent
  # push) rather than only the happy one.
  scripts:
    runs-on: ubuntu-latest
    # The suite runs in about two seconds. A limit this loose only ever fires
    # on a hang, which is a real possibility for code whose job is retry loops
    # and network waits -- without it, a hung run burns the job's default
    # allowance instead of failing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The script under test exists to `git push` to main, and on a
          # push-to-main run this job's token can write. It only ever touches
          # throwaway repositories under /tmp, so this changes nothing today;
          # it removes the possibility that a future edit makes it matter.
          persist-credentials: false

      # binstall rather than `cargo install b3sum`, which spends a minute
      # compiling a hashing tool this job only shells out to.
      #
      # Version-pinned and `--locked` for the same reason as the dioxus-cli
      # install below: when binstall falls back to compiling from source, an
      # unpinned, freshly-resolved dependency tree breaks the moment any
      # transitive dependency starts requiring a rustc newer than the 1.95.0
      # this repo pins. `--locked` makes the fallback build from the crate's
      # published Cargo.lock instead.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install b3sum
        run: cargo binstall -y --force --locked b3sum@1.8.6

      - name: Migration-record tests
        run: bash tests/record-migration.test.sh

  # The vault ships as a WASM bundle, so none of the Rust tests above can see
  # whether a user can actually read or click anything: rendering a component
  # tree in a native test does not exercise the compiled bundle, its event
  # handlers, or its asset paths. This job loads the real bundle in Chromium.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned to the version these checks were written against. Note it is
      # ahead of the `dioxus = "=0.7.3"` library pin in Cargo.toml; 0.7.9 is
      # what builds this bundle locally, and dx tolerates the gap. If you bump
      # the library pin, re-run scripts/browser-test.sh before bumping here.
      #
      # binstall rather than `cargo install`: it fetches a prebuilt binary
      # instead of compiling the CLI from source on every run.
      #
      # `--force` is load-bearing. `Swatinem/rust-cache` restores cargo's
      # installed-crates registry (`~/.cargo/.crates.toml`) but not
      # `~/.cargo/bin`, so on a cache hit binstall reports "already installed"
      # and skips -- leaving no `dx` on PATH and a failure two steps later that
      # points at the wrong thing entirely.
      #
      # `--locked` is load-bearing too. When no prebuilt binary can be
      # fetched, binstall falls back to `cargo install`, which by default
      # re-resolves the dependency tree fresh -- so a transitive dependency
      # published yesterday can require a rustc newer than the 1.95.0 this
      # repo pins and break every CI run with no change in the repo (this
      # actually happened: kstring 2.0.4 raised its MSRV to 1.96.0 and took
      # out CI repo-wide). `--locked` passes through to that fallback and
      # builds from the Cargo.lock published with the crate, which is the
      # tree the release was actually built against.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus-cli
        run: cargo binstall -y --force --locked dioxus-cli@0.7.9

      - name: Install browser test deps
        working-directory: ui/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: bash scripts/browser-test.sh

  # The delegate re-keys on any WASM change, and ghostkeys now publishes a
  # pointer record at a fixed address naming its current code hash. A published
  # pointer that still names the OLD hash is worse than no pointer: an
  # integrator resolves it, gets a confident answer, and derives a dead key —
  # freenet/ghostkeys#21 again, with our own signature on it.
  #
  # WHY THIS JOB LIVES HERE rather than in check-migration.yml, which already
  # builds the delegate:
  #
  #   * check-migration.yml is `pull_request` only. This gate also has to run on
  #     push-to-main, because that is the tree publish-pointer-records.sh reads.
  #   * check-migration.yml is path-filtered. That filter is carefully
  #     maintained, and it is exactly the kind of thing that goes stale: a path
  #     nobody listed re-keys the delegate and the gate does not run at all.
  #     This workflow has no path filter, so the gate cannot be skipped by
  #     forgetting to add a path — it can only be skipped by deleting the job.
  #   * pointer-records.toml can go stale from an edit to itself, which is not a
  #     delegate path under any reading.
  #
  # The cost is building the delegate twice across the two workflows. That is a
  # cached ~30s, and it buys a gate whose coverage does not depend on a list.
  pointer-freshness:
    name: pointer record names the delegate this source builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Load-bearing on PRs: the gate compares against the base commit to
          # confirm the version moved and that no record vanished, and reads
          # that side with `git show`. A depth-1 checkout has no base to read.
          fetch-depth: 0

      # Same pin as every other job here. It matters more than usual: the gate
      # hashes a BUILT artifact, so a different rustc yields a different hash
      # and the record would look stale for no reason.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main
      # `--force` because rust-cache restores ~/.cargo/.crates.toml but not
      # ~/.cargo/bin, so on a cache hit binstall reports "already installed"
      # and leaves nothing on PATH. `--locked` so the compile-from-source
      # fallback builds from the crate's published lockfile rather than a
      # freshly-resolved tree that can demand a newer rustc than 1.95.0.
      - name: Install b3sum
        run: cargo binstall -y --force --locked b3sum@1.8.6

      # Pinned by revision AND --locked. This tool decides what a record's
      # bytes ARE; a gate whose oracle can change under it is not a gate. The
      # rev is read from the script so there is one place to bump.
      - name: Install pointer-record
        run: |
          REV="$(grep -m1 '^POINTER_TOOL_REV=' scripts/check-pointer-freshness.sh \
                 | sed 's/.*:-\([0-9a-f]*\)}.*/\1/')"
          # Reject empty, ANY character that is not lowercase hex, and anything
          # shorter than a short SHA. A glob like `[0-9a-f]x7 *` accepts
          # arbitrary TRAILING text -- `abcdef1 --features evil` passes it and
          # lands in the cargo command below. A guard that validates "the
          # shape" has to actually do that.
          case "$REV" in
            ""|*[!0-9a-f]*) echo "POINTER_TOOL_REV is not lowercase hex: '$REV'"; exit 1 ;;
          esac
          test "${#REV}" -ge 7 || { echo "POINTER_TOOL_REV too short: '$REV'"; exit 1; }
          cargo install --git https://github.com/freenet/freenet-migrate \
            --rev "$REV" --features publish --locked freenet-pointer-contract

      # Its own step so the delegate hash is visible in the log next to the
      # record it is compared against -- directly comparable to a local build,
      # which is the only evidence the ghostkeys#9 reproducibility fix still
      # holds. The gate is then run with --no-build so nothing rebuilds behind
      # this step's back.
      - name: Build delegate WASM
        run: bash scripts/build-delegate.sh

      # Two invocations, because on a push `github.event.pull_request.*` is
      # EMPTY: passing it through unconditionally would invoke `--base ""` on
      # every push to main.
      - name: Verify the pointer record (PR)
        if: github.event_name == 'pull_request'
        run: |
          ./scripts/check-pointer-freshness.sh --no-build \
            --base "${{ github.event.pull_request.base.sha }}"

      - name: Verify the pointer record (push)
        if: github.event_name != 'pull_request'
        run: ./scripts/check-pointer-freshness.sh --no-build
