name: Test

# Until this existed, `check-migration.yml` was the repo's only workflow: the
# delegate that holds users' signing keys, and the vault that recovers them
# across a re-key, both merged with no automated test, lint, or format gate.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Named to match rust-toolchain.toml, which is what actually governs the
      # build: it outranks the rustup default this action sets. Stated
      # explicitly here because the version matters — the delegate key is
      # BLAKE3(BLAKE3(wasm) || params), so a different rustc yields a different
      # key — but the toml is what enforces it, not this line.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # The UI embeds the delegate WASM via include_bytes!, so the artifact has
      # to exist before the UI crate can be built or linted at all.
      - name: Build delegate WASM
        run: cargo build --target wasm32-unknown-unknown --release -p ghostkey-delegate

      # Lint against wasm32 rather than the host. The UI's real code paths are
      # behind `#[cfg(target_arch = "wasm32")]`, so a native lint sees stubs
      # and reports the whole delegate API as dead code while missing anything
      # actually wrong in the shipped code.
      - name: Clippy (shipped target)
        run: cargo clippy --target wasm32-unknown-unknown --workspace -- -D warnings

      # wasm32 does not compile #[cfg(test)] code at all, so without this pass
      # the test modules are linted by nothing. Native, and matching
      # `cargo make clippy-tests`.
      - name: Clippy (test code)
        run: cargo clippy --workspace --tests -- -D warnings

      # Run natively: this is what exercises the pure decision logic (probe
      # classification, migration outcomes, base64 and PEM parsing) plus the
      # delegate's own tests.
      - name: Test
        run: cargo test --workspace

  # The vault ships as a WASM bundle, so none of the Rust tests above can see
  # whether a user can actually read or click anything: rendering a component
  # tree in a native test does not exercise the compiled bundle, its event
  # handlers, or its asset paths. This job loads the real bundle in Chromium.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned to the version these checks were written against. Note it is
      # ahead of the `dioxus = "=0.7.3"` library pin in Cargo.toml; 0.7.9 is
      # what builds this bundle locally, and dx tolerates the gap. If you bump
      # the library pin, re-run scripts/browser-test.sh before bumping here.
      #
      # binstall rather than `cargo install`: it fetches a prebuilt binary
      # instead of compiling the CLI from source on every run.
      #
      # `--force` is load-bearing. `Swatinem/rust-cache` restores cargo's
      # installed-crates registry (`~/.cargo/.crates.toml`) but not
      # `~/.cargo/bin`, so on a cache hit binstall reports "already installed"
      # and skips -- leaving no `dx` on PATH and a failure two steps later that
      # points at the wrong thing entirely.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dioxus-cli
        run: cargo binstall -y --force dioxus-cli@0.7.9

      - name: Install browser test deps
        working-directory: ui/tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: bash scripts/browser-test.sh
