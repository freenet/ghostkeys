name: Check delegate migration

on:
  pull_request:
    paths:
      - 'delegates/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # rust-toolchain.toml belongs here for the same reason as the rest: its
      # own comment says a different rustc produces different WASM bytes and
      # therefore a different delegate key, which "silently orphans every
      # user's data". Without it, a toolchain-bump-only PR re-keys the
      # delegate and skips this guard entirely.
      - 'rust-toolchain.toml'
      # Both of these change the emitted WASM bytes, and therefore the
      # delegate key, without touching any path above: the build script sets
      # the registry remap that keeps the key machine-independent, and cargo
      # config carries flags and the target dir. Omitting them let a re-key
      # skip this guard for the same reason rust-toolchain.toml did.
      - '.cargo/config.toml'
      - 'scripts/build-delegate.sh'
      # The guard's main job is catching a PR that drops a recorded entry, and
      # a PR can drop one by editing nothing but this file.
      - 'legacy_delegates.toml'

jobs:
  check-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned rather than @stable so the version this job builds with is
      # visible here, next to the hash it computes.
      #
      # To be accurate about what this does and does not fix: it was NOT
      # previously building with the wrong compiler. The action sets a rustup
      # DEFAULT, and `rust-toolchain.toml` outranks the default, so cargo
      # already resolved to the pinned channel either way (checked: with a
      # `rust-toolchain.toml` present, `rustc --version` reports the pinned
      # version while `rustup default` reports stable). The pin is
      # belt-and-braces, not a bug fix — the real gap this commit closes is the
      # path filter below.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install b3sum
        run: cargo install b3sum

      # Through the script, so the hash CI computes is the hash a developer
      # gets locally. A bare `cargo build` embeds this runner's $CARGO_HOME
      # paths and produces a different, runner-specific delegate key
      # (ghostkeys#9). The printed hash is directly comparable to a local one.
      - name: Build delegate WASM
        run: bash scripts/build-delegate.sh

      # Extracting the base file with `git show` rather than the previous
      # `git stash` / `git checkout -- file` / `git stash pop` dance: that
      # sequence mutated the working tree mid-check and swallowed both stash
      # failures with `|| true`, so a failed pop would have left later steps
      # reading the wrong tree while reporting success.
      - name: Extract base branch's legacy_delegates.toml
        run: |
          git show "${{ github.event.pull_request.base.sha }}:legacy_delegates.toml" \
            > /tmp/base_legacy_delegates.toml

      # One implementation, called from both CI and `cargo make check-migration`,
      # so the rule cannot drift between what blocks a PR and what blocks a
      # publish.
      - name: Check migration coverage
        run: bash scripts/check-migration.sh /tmp/base_legacy_delegates.toml
