[package]
name = "ghostkey-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ghostkey management UI for Freenet"

[features]
default = []
example-data = []
no-sync = []

[dependencies]
ghostkey-common = { workspace = true }
freenet-stdlib = { workspace = true, features = ["net"] }
# The shared registry-and-probe crate; owns the migration WALK while the
# app-specific judgements stay in ui/src/migration.rs. UI-side only: nothing
# in delegates/ may depend on this (a delegate dependency change re-keys the
# WASM, which is the event being migrated across).
freenet-migrate = { version = "0.5.0", default-features = false, features = ["ui"] }
dioxus = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
gloo-timers = { workspace = true }
futures = { workspace = true }
# Required for wasm32-unknown-unknown: use JS crypto.getRandomValues for RNG
js-sys = { workspace = true }
serde_json = { workspace = true }
# Required for wasm32-unknown-unknown: use JS crypto.getRandomValues for RNG
getrandom = { version = "0.2", features = ["js", "wasm-bindgen", "js-sys"], default-features = false }

[build-dependencies]
chrono = { workspace = true }
# Build-time validation of legacy_delegates.toml: every entry's delegate_key
# must equal BLAKE3 over the raw bytes of its code_hash, or the build fails.
blake3 = { workspace = true }

[dev-dependencies]
# The delegate-WASM baseline pin (migration_registry_pin.rs) hashes the built
# artifact.
blake3 = { workspace = true }

