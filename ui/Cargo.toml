[package]
name = "ghostkey-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ghostkey management UI for Freenet"

[features]
default = []
example-data = []
no-sync = []

[dependencies]
ghostkey-common = { workspace = true }
freenet-stdlib = { workspace = true, features = ["net"] }
dioxus = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
gloo-timers = { workspace = true }
futures = { workspace = true }
# Required for wasm32-unknown-unknown: use JS crypto.getRandomValues for RNG
js-sys = { workspace = true }
serde_json = { workspace = true }
# Required for wasm32-unknown-unknown: use JS crypto.getRandomValues for RNG
getrandom = { version = "0.2", features = ["js", "wasm-bindgen", "js-sys"], default-features = false }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
# Test-only: the differential test drives freenet-migrate 0.4.0's delegate
# migration path against ghostkeys' shipped sweep. Not used by any production
# code path (see ui/src/migration_differential.rs).
freenet-migrate = { version = "0.4.0", default-features = false, features = ["ui"] }
# The crate requires freenet-stdlib 0.8; ghostkeys is pinned to 0.6. Aliased so
# the differential can hold both and convert by raw key bytes. See
# `the_crate_forces_a_second_freenet_stdlib_into_the_graph`.
freenet-stdlib-08 = { package = "freenet-stdlib", version = "0.8.2", default-features = false }
