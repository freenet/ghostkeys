[config]
default_to_workspace = false

[env]
CONTRACT_TARGET = "wasm32-unknown-unknown"
BUILD_PROFILE = "release"
CONTRACT_ID = "DLog47hEsrtuGT4N5XCeMBG45m4n1aWM89tBZXue2E1N"
WEB_CONTAINER_TOOL = "${HOME}/code/freenet/river/main/target/native/x86_64-unknown-linux-gnu/release/web-container-tool"
KEY_FILE = "${HOME}/.config/ghostkeys/web-container-keys.toml"

# --- Build tasks ---

[tasks.add-migration]
description = "Record current delegate key in legacy_delegates.toml (run BEFORE changing delegate/common code)"
command = "bash"
args = ["scripts/add-migration.sh"]

[tasks.check-migration]
description = "Verify migration coverage before publishing (fails fast if unsafe)"
dependencies = ["build-delegate"]
command = "bash"
args = ["scripts/check-migration.sh"]

[tasks.browser-test]
description = "Build the UI and drive it in a real browser (Playwright + Chromium)"
command = "bash"
args = ["scripts/browser-test.sh"]

[tasks.record-migration]
description = "Record the built delegate hash in legacy_delegates.toml on origin/main"
# Depends on build-delegate for the same reason check-migration does: without
# it this hashes whatever stale WASM happens to be sitting in target/ and
# pushes that hash to a shared branch.
dependencies = ["build-delegate"]
command = "bash"
args = ["scripts/record-migration.sh"]

[tasks.preflight-migration]
description = "Refuse to publish from a checkout whose migration table is behind main"
# Read-only, and a dependency of sign-webapp rather than a step in the publish
# script, so it runs BEFORE the UI is built rather than after it is signed.
#
# What it checks is the direction the rest of this machinery does not:
# ui/build.rs compiles legacy_delegates.toml from the WORKING TREE into the
# bundle, so a checkout that is merely behind main ships a sweep table missing
# entries main already has, and orphans everyone running those delegates.
dependencies = ["build-delegate"]
command = "bash"
args = ["scripts/record-migration.sh", "--preflight"]

[tasks.test-scripts]
description = "Test the migration-record machinery (git only, no network)"
command = "bash"
args = ["tests/record-migration.test.sh"]

[tasks.build-delegate]
description = "Build the ghostkey delegate WASM reproducibly"
# Via the script, not a bare `cargo build`: the delegate key is BLAKE3 over
# these bytes, and without the script's path remap the key comes out
# machine-specific. See ghostkeys#9.
command = "bash"
args = ["scripts/build-delegate.sh"]

[tasks.build-ui]
description = "Build the Dioxus UI"
dependencies = ["build-delegate"]
command = "dx"
args = ["build", "--${BUILD_PROFILE}"]
cwd = "./ui"

[tasks.write-delegate-pointer]
description = "Publish the current delegate key inside the webapp bundle"
# Between build-ui and compress-webapp on purpose: the pointer has to be
# written after the bundle exists and before it is sealed, so it ships in the
# same archive as the delegate it names and cannot drift from it.
dependencies = ["build-ui"]
command = "bash"
args = ["scripts/write-delegate-pointer.sh"]

[tasks.compress-webapp]
description = "Compress the UI into a tar.xz archive"
dependencies = ["build-ui", "write-delegate-pointer"]
script = '''
mkdir -p target/webapp
cd target/dx/ghostkey-ui/${BUILD_PROFILE}/web/public && tar -cJf ../../../../../webapp/webapp.tar.xz *
echo "Compressed webapp to target/webapp/webapp.tar.xz"
'''

[tasks.check-delegate-pointer]
description = "Verify the published pointer names the delegate actually shipping"
dependencies = ["compress-webapp"]
command = "bash"
args = ["scripts/check-delegate-pointer.sh"]

[tasks.sign-webapp]
description = "Sign the webapp archive with the web-container-tool"
# preflight-migration first, and deliberately ahead of compress-webapp: it is
# the one check whose answer can make the whole build pointless, so paying for
# a UI build before asking it wastes the operator's time for nothing.
dependencies = [
  "preflight-migration",
  "compress-webapp",
  "check-migration",
  "check-delegate-pointer",
]
script = '''
VERSION=$(( $(date +%s) / 60 ))
echo "Signing with version: $VERSION"
${WEB_CONTAINER_TOOL} sign \
  --input target/webapp/webapp.tar.xz \
  --output target/webapp/webapp.metadata \
  --parameters published-contract/webapp.parameters \
  --version $VERSION \
  --key-file ${KEY_FILE}
'''

[tasks.publish-ghostkeys]
description = "Publish the ghostkey UI to the Freenet network"
dependencies = ["sign-webapp"]
script = '''
set -e

# Record BEFORE publishing, which is the opposite of the order this used to
# run in, on purpose.
#
# The hash is knowable either way -- it comes from the WASM that sign-webapp
# already built and bundled, not from anything the publish returns -- so the
# only thing the old ordering bought was a window. If recording failed after a
# successful publish, the delegate was already live and unrecorded, which is
# precisely the 2026-08-03 incident; all the script could do was shout about a
# state that already existed. Recording first turns that into an abort with
# nothing deployed.
#
# The failure this ordering can produce instead is a recorded hash that never
# gets published: the sweep then probes a delegate nobody runs, finds nothing,
# and moves on. The file already carries such entries from 2026-05-05 and says
# so. That is the right trade -- under-recording loses users' ghost keys --
# but it is not free, and the cost is worse than "one wasted probe": every
# user pays a bounded 3s background probe (LEGACY_PROBE_TIMEOUT_SECS,
# ui/src/migration.rs) for that entry on EVERY vault load, permanently, and it
# compounds with each one. check-migration's no-drop rule then makes it
# unremovable by ordinary means. So if a publish is abandoned after the record
# lands, treat the spare entry as a small debt worth clearing deliberately --
# see the note in scripts/check-migration.sh.
bash scripts/record-migration.sh

echo ""
fdev network publish \
  --code published-contract/web_container_contract.wasm \
  --parameters published-contract/webapp.parameters \
  contract \
  --webapp-archive target/webapp/webapp.tar.xz \
  --webapp-metadata target/webapp/webapp.metadata
echo ""
echo "Published to: http://127.0.0.1:7509/v1/contract/web/${CONTRACT_ID}/"

# Read the record back off the remote once more, now that the delegate is
# actually live. Cheap, and it catches the one case the pre-publish run cannot:
# the branch being rewritten in between.
echo ""
bash scripts/record-migration.sh --verify-only
'''

# --- Development tasks ---

[tasks.dev]
description = "Run UI in development mode with example data"
dependencies = ["build-delegate"]
command = "dx"
args = ["serve", "--features", "example-data"]
cwd = "./ui"

[tasks.dev-no-sync]
description = "Run UI without Freenet connection"
command = "dx"
args = ["serve", "--features", "example-data,no-sync"]
cwd = "./ui"

# --- Testing ---

[tasks.test]
description = "Run all tests"
# Includes the shell tests: `cargo test` cannot see scripts/, and the migration
# machinery is the part of this repo where a silent failure costs users their
# ghost keys.
#
# build-delegate first: the delegate-WASM baseline pin
# (ui/src/migration_registry_pin.rs) hashes the built artifact and FAILS when
# it is missing or was built without the path remap — a guard that silently
# skipped would be a guard that cannot fail. CI's test job builds it the same
# way before `cargo test`.
dependencies = ["build-delegate", "test-scripts"]
command = "cargo"
args = ["test", "--workspace"]

# Two invocations, because neither target alone covers the code.
#
# wasm32 is what ships: the UI's real code paths are behind
# cfg(target_arch = "wasm32"), so a native lint sees only stubs and reports the
# entire delegate API as dead code. But #[cfg(test)] code is not compiled for
# wasm32, so the test modules are linted natively instead.
#
# Kept in step with .github/workflows/test.yml deliberately: this task used to
# be a native --all-targets run that failed with more than a dozen dead-code
# errors, so anyone running it by hand could not tell their own mistakes from
# the standing noise.
[tasks.clippy]
description = "Run clippy for the shipped target and for test code"
dependencies = ["clippy-wasm", "clippy-tests"]

[tasks.clippy-wasm]
description = "Lint the code that actually ships"
command = "cargo"
args = [
  "clippy",
  "--target",
  "wasm32-unknown-unknown",
  "--workspace",
  "--",
  "-D",
  "warnings",
]

[tasks.clippy-tests]
description = "Lint test code, which wasm32 does not compile"
command = "cargo"
args = ["clippy", "--workspace", "--tests", "--", "-D", "warnings"]

# --- Utility ---

[tasks.generate-import-url]
description = "Generate an import URL from PEM files. Usage: cargo make generate-import-url cert.pem sk.pem"
command = "bash"
args = ["scripts/generate-import-url.sh", "${@}"]
