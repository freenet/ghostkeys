# The published `ghostkey-common` crate (crates.io), from 0.4.0 on.
#
# Why this is not `common/`: the deployed ghostkey delegate links `common/` as
# `ghostkey-common 0.3.0`, and the delegate key is BLAKE3 over its WASM. Any
# change to that package's identity -- its version, or its source (a path
# elsewhere, or the identical 0.3.0 from crates.io) -- changes the delegate's
# bytes and RE-KEYS it, measured on 2026-10-27. So `common/` stays exactly as
# the delegate needs it, and new releases are cut from here.
#
# `src/lib.rs` is a byte-for-byte copy of `common/src/lib.rs`, enforced by CI
# (`.github/workflows/test.yml`, job `ghostkey-common-crate`), so the wire
# types the delegate speaks and the ones apps compile against cannot drift.
# Edit both together. Release procedure: README.md, "Releasing ghostkey-common".
#
# Its own workspace, so it resolves freenet-stdlib independently of the
# delegate and UI, which stay on 0.8.

[workspace]

[package]
name = "ghostkey-common"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freenet/ghostkeys"
description = "Wire types for communicating with the Freenet ghostkey delegate (GhostkeyRequest/GhostkeyResponse). Use this crate from a Freenet dapp that needs to sign messages or read ghostkey identity info via the delegate. For low-level ghostkey certificate crypto, see ghostkey_lib instead."
readme = "README.md"
keywords = ["freenet", "ghostkey", "delegate"]
categories = ["cryptography"]

[features]
default = []
# Enable crypto operations (fingerprint computation, etc.)
crypto = ["dep:ed25519-dalek", "dep:blake3", "dep:bs58"]

[dependencies]
# A range, so one release serves dapps on any of these stdlib versions.
# Everything linked into one WASM must share a single freenet-stdlib, and a
# dapp on 0.12 (freenet/mail) cannot use a crate pinned to 0.8. The only stdlib
# types used are ContractInstanceId, DelegateKey and CodeHash, whose
# definitions and serde encoding are identical across the range; the
# `wire_golden` tests pin the bytes, and CI runs them at both ends.
freenet-stdlib = ">=0.8, <0.13"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"

# Optional crypto deps (needed by delegate, not by UI)
ed25519-dalek = { version = "2.1", features = ["serde"], optional = true }
blake3 = { version = "1", optional = true }
bs58 = { version = "0.5", optional = true }

[dev-dependencies]
# Used only to pin the JSON-visible field names of the wire types; serde tags
# enum variants by name in CBOR too, so a JSON assertion catches a CBOR break.
serde_json = "1"
