[workspace]
members = [
    "common",
    "delegates/ghostkey-delegate",
    "ui",
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/freenet/ghostkeys"

[workspace.dependencies]
ghostkey-common = { path = "common" }
ghostkey_lib = "0.2"
freenet-stdlib = "0.6"
ed25519-dalek = { version = "2.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
blake3 = "1"
bs58 = "0.5"
getrandom = { version = "0.2", features = ["custom"] }
serde_json = "1"
chrono = "0.4"
dioxus = { version = "=0.7.3", features = ["web"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement", "HtmlElement", "FileReader", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Storage"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# `strip = true` removes debug symbols, which is worth having.
#
# It does NOT make the build reproducible across machines, though this
# comment used to claim exactly that. Measured on 2026-08-03: 50 absolute
# registry paths survive `strip` in the release WASM, because `panic!`
# embeds `file!()` as ordinary rodata rather than as debug info. The
# claim was load-bearing -- it is why nobody looked further at
# ghostkeys#9 -- so it is corrected rather than deleted.
#
# What actually makes the build reproducible is a committed Cargo.lock
# plus the registry path remap in scripts/build-delegate.sh. Build the
# delegate through that script (`cargo make build-delegate`), not with a
# bare `cargo build`, or you will get a different delegate key.
strip = true

# Apply size+reproducibility optimisations to dependencies too, so a
# Cargo.lock change in a leaf crate doesn't accidentally bloat the
# delegate WASM via a release-profile mismatch.
[profile.release.package."*"]
opt-level = "z"
