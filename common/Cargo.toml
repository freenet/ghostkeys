# FROZEN: this is the `ghostkey-common 0.3.0` the deployed ghostkey delegate is
# built from. Do not change its version or dependencies: the delegate key is
# BLAKE3 over the delegate WASM, and changing this package's identity changes
# those bytes (measured 2026-10-27: a version bump to 0.4.0 alone re-keyed it).
#
# It is no longer what gets published. Releases of ghostkey-common (0.4.0 on)
# are cut from `crates-io/ghostkey-common/`, whose `src/lib.rs` CI requires to
# be identical to this one's. Edit both together. Unfreeze (and fold the two
# back together) only as part of a deliberate delegate re-key.
[package]
name = "ghostkey-common"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire types for communicating with the Freenet ghostkey delegate (GhostkeyRequest/GhostkeyResponse). Use this crate from a Freenet dapp that needs to sign messages or read ghostkey identity info via the delegate. For low-level ghostkey certificate crypto, see ghostkey_lib instead."
readme = "README.md"
keywords = ["freenet", "ghostkey", "delegate"]
categories = ["cryptography"]

[features]
default = []
# Enable crypto operations (fingerprint computation, etc.)
crypto = ["dep:ed25519-dalek", "dep:blake3", "dep:bs58"]

[dependencies]
freenet-stdlib = { workspace = true }
serde = { workspace = true }
ciborium = { workspace = true }

# Optional crypto deps (needed by delegate, not by UI)
ed25519-dalek = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }

[dev-dependencies]
# Used only to pin the JSON-visible field names of the wire types; serde tags
# enum variants by name in CBOR too, so a JSON assertion catches a CBOR break.
serde_json = { workspace = true }
